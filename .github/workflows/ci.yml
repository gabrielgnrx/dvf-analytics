name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  dbt:
    name: dbt (compilation du projet)
    runs-on: ubuntu-latest
    env:
      # dbt parse ne se connecte pas à BigQuery : un projet fictif suffit.
      GCP_PROJECT_ID: dvf-analytics-ci
    defaults:
      run:
        working-directory: dbt/dvf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install dbt-bigquery==1.8.2
      - run: dbt deps --profiles-dir ../../.github/dbt
      - run: dbt parse --profiles-dir ../../.github/dbt
