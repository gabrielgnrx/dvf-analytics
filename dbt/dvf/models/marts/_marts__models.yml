version: 2

models:
  - name: fact_transactions
    description: "Table de faits des ventes immobilières, grain = une mutation."
    columns:
      - name: transaction_id
        description: "Identifiant DVF de la mutation (grain de la table)."
        tests: [unique, not_null]
      - name: date_key
        description: "Date de la vente au format AAAAMMJJ, clé vers dim_temps."
        tests:
          - not_null
          - relationships:
              to: ref('dim_temps')
              field: date_key
      - name: geo_key
        description: "Code INSEE de la commune majoritaire de la mutation, clé vers dim_geo."
        tests:
          - not_null
          - relationships:
              to: ref('dim_geo')
              field: geo_key
      - name: bien_key
        description: "Clé de substitution type x pièces x tranche de surface, vers dim_bien."
        tests:
          - not_null
          - relationships:
              to: ref('dim_bien')
              field: bien_key
      - name: valeur_fonciere
        description: "Prix de vente en euros, compté une seule fois par mutation."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
      - name: prix_m2
        description: "Prix au m² habitable, renseigné uniquement pour les ventes simples d'un logement."
        tests:
          # En avertissement : quelques ventes à valeur symbolique (quelques
          # euros) donnent un prix arrondi à 0. Elles sont conservées et
          # écartées par est_prix_m2_fiable plutôt que supprimées.
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
              config:
                severity: warn
      - name: est_vente_simple
        description: "Vrai si la mutation porte sur un seul logement (dépendances tolérées), sans local d'activité, avec une seule valeur foncière."
      - name: est_prix_m2_fiable
        description: "Vrai si le prix au m² existe et se situe entre 1 000 et 30 000 euros."
      - name: type_bien
        description: "Appartement, Maison, Multi-logements, Local commercial, Dépendance seule, Terrain / non bâti."
      - name: dist_gare_m
        description: "Distance à la gare lourde la plus proche (métro, RER, train, VAL), en mètres, plafonnée à 5 km."
      - name: tranche_dist_gare
        description: "Tranche de distance à la gare la plus proche."
        tests:
          - accepted_values:
              values: ['1. Moins de 500 m', '2. 500 m à 1 km', '3. 1 à 2 km', '4. Plus de 2 km']
      - name: dist_gpe_m
        description: "Distance à la future gare du Grand Paris Express la plus proche, en mètres, plafonnée à 10 km."
      - name: tranche_dist_gpe
        description: "Tranche de distance à la future gare du Grand Paris Express."
        tests:
          - accepted_values:
              values: ['1. Moins de 800 m', '2. 800 m à 1,5 km', '3. 1,5 à 3 km', '4. Plus de 3 km']

  - name: dim_geo
    description: "Dimension commune (arrondissement pour Paris), avec département et zone."
    columns:
      - name: geo_key
        tests: [unique, not_null]
      - name: zone
        tests: [not_null]
      - name: revenu_median_uc
        description: "Revenu disponible médian par unité de consommation (€/an, INSEE Filosofi). Nul si secret statistique."
        tests:
          - dbt_utils.accepted_range: {min_value: 5000, max_value: 100000}
      - name: part_dpe_fg_pct
        description: "Part des logements diagnostiqués classés F ou G (passoires thermiques), en %."
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 100}

  - name: dim_temps
    description: "Dimension calendrier au jour."
    columns:
      - name: date_key
        tests: [unique, not_null]

  - name: dim_bien
    description: "Dimension typologie de bien x nombre de pièces x tranche de surface."
    columns:
      - name: bien_key
        tests: [unique, not_null]

  - name: mart_ecarts_prix
    description: "Ventes simples comparées au prix au m² prédit par le modèle (écart en %)."
    columns:
      - name: transaction_id
        tests: [unique, not_null]

  - name: mart_proximite_gpe
    description: >
      Prix au m² médian par année, zone, type de bien et distance à la future
      gare du Grand Paris Express (hors Paris), avec l'évolution depuis la
      première année disponible.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [annee, zone, type_bien, tranche_dist_gpe]
    columns:
      - name: prix_m2_median
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 500, max_value: 30000}
